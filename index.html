const state={settings:{music:55,sfx:75,shake:true,hints:true,low:false,autoNext:true},mode:'story',index:0,visitor:null,stats:null,streak:0,best:0,paused:false,ended:false,questionCount:0,asked:[],log:'',audio:null,master:null,musicTimer:null,melodyStep:0,toastTimer:null,sessionStart:0};
function saveSettings(){try{localStorage.setItem('nalfate_settings',JSON.stringify(state.settings))}catch(e){}}
try{Object.assign(state.settings,JSON.parse(localStorage.getItem('nalfate_settings')||'{}'))}catch(e){}
function initStats(){state.stats={normalSaved:0,nalSacrificed:0,normalSacrificed:0,nalSaved:0,total:0,correct:0,streak:0,best:0};}
function showToast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.classList.add('hidden'),1800)}
function audio(){if(!state.audio){try{state.audio=new (window.AudioContext||window.webkitAudioContext)();state.master=state.audio.createGain();state.master.gain.value=0.35;state.master.connect(state.audio.destination)}catch(e){}}if(state.audio?.state==='suspended')state.audio.resume();return state.audio}
function tone(freq,dur,type='sine',vol=.12,when=0){const a=audio();if(!a)return;let o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,a.currentTime+when);g.gain.setValueAtTime(0.0001,a.currentTime+when);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol*state.settings.sfx/100),a.currentTime+when+.015);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+when+dur);o.connect(g);g.connect(state.master);o.start(a.currentTime+when);o.stop(a.currentTime+when+dur+.03)}
function sfx(kind){if(!state.settings.sfx)return;const patterns={click:[[520,.05,'square',.05]],ask:[[620,.08,'triangle',.08],[820,.09,'triangle',.06,.07]],good:[[523,.12,'sine',.1],[659,.12,'sine',.1,.09],[784,.2,'sine',.1,.18]],bad:[[160,.16,'sawtooth',.12],[90,.24,'square',.1,.12]],reveal:[[180,.13,'sawtooth',.1],[440,.1,'square',.09,.12],[110,.28,'sawtooth',.12,.23]],win:[[523,.12,'triangle',.1],[659,.12,'triangle',.1,.12],[784,.12,'triangle',.1,.24],[1046,.3,'triangle',.1,.36]],wrong:[[220,.13,'square',.08],[185,.17,'square',.08,.13]]};(patterns[kind]||patterns.click).forEach(p=>tone(p[0],p[1],p[2],p[3],p[4]||0))}
function startMusic(){stopMusic();if(!state.settings.music)return;audio();const seq=[196,246.94,293.66,369.99,329.63,246.94,220,293.66];state.musicTimer=setInterval(()=>{if(state.paused||!state.settings.music||!state.audio)return;const f=seq[state.melodyStep++%seq.length];const a=state.audio,o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.0001;g.gain.setTargetAtTime(.025*state.settings.music/100,a.currentTime,.03);g.gain.setTargetAtTime(.0001,a.currentTime+.22,.08);o.connect(g);g.connect(state.master);o.start();o.stop(a.currentTime+.48);if(state.melodyStep%4===0)tone(f/2,.25,'sine',.025)},360)}
function stopMusic(){clearInterval(state.musicTimer);state.musicTimer=null}
function setScreen(html){screen.innerHTML=html;screen.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.silent!=='1')sfx('click')}))}
function home(){state.paused=false;stopMusic();$('#topMode').textContent='REALITY STATUS: UNSTABLE';setScreen(`<div class="panel"><div class="logo">NAL FATE</div><div class="subtitle">CHOOSE WISELY • TRUST NOBODY</div><div class="menu-buttons"><button class="primary" id="play">▶ PLAY</button><button id="settings">⚙ SETTINGS</button><button id="how">▣ HOW TO PLAY</button></div><div class="rule"></div><p class="tiny" style="text-align:center">Hotel shift: 25 tamu. Peluang NAL: 50%.<br>Hukum fisika tidak termasuk dalam paket asuransi.</p></div>`);$('#play').onclick=()=>modeChoice();$('#settings').onclick=()=>settingsScreen('home');$('#how').onclick=()=>howScreen('home')}

function showCall(){stopMusic();setScreen(`<div class="panel"><div class="pill">INCOMING CALL • BOSS</div><h2 class="section-title">☎ BRIEFING SEBELUM KIAMAT</h2><div class="callbox"><b>BOSS:</b> “Hey, belakangan ini ada orang-orang yg bertingkah aneh, karakter-karakter NAL telah menginvasi kotak kita. Jika mereka berbicara dengan nada NAL atau "Nonsense As Life", jangan biarkan mereka masuk. Pilihan ditanganmu, hati-hati.”</div><p class="tiny">Sambungan berakhir. Di kejauhan, terdengar satu ayam menuntut hak makan.</p><button class="primary" id="startshift">MULAI SHIFT →</button></div>`);$('#startshift').onclick=()=>{startMusic();newVisitor()}}
function newVisitor(){if(state.mode==='story'&&state.index>=25){finishStory();return}state.index++;state.asked=[];state.questionCount=0;state.log='';const isNal=Math.random()<.5;const norm=normalAnswers[Math.floor(Math.random()*normalAnswers.length)];const c=chars[Math.floor(Math.random()*chars.length)];state.visitor={isNal,emoji:['👨','👩','🧑'][Math.floor(Math.random()*3)],char:c,normal:norm,asked:{},decided:false};renderGame()}
function renderGame(){if(!state.visitor){home();return}const v=state.visitor;$('#topMode').textContent=(state.mode==='story'?'STORY':'ENDLESS')+' • SHIFT '+(state.mode==='story'?state.index+'/25':state.index+' TAMU');const qbuttons=Qs.map((q,i)=>`<button data-q="${i}" ${v.asked[i]?'disabled':''}>${i+1}. ${q}</button>`).join('');setScreen(`<div class="game-wrap"><div class="hud"><span>SHIFT <strong>${state.index}${state.mode==='story'?'/25':''}</strong></span><span>VERDICT STREAK <strong>${state.streak}</strong></span><span>Paul: <strong>🍗 TAK TERBATAS</strong></span><button id="pause" style="padding:6px 12px">Ⅱ PAUSE</button></div><div class="game-panel ${state.settings.low?'':'scanlines'}" id="gamepanel">
<div class="callbox"><b>HOTEL NAL • SECURITY DESK</b><br>“Selamat siang, aku ingin masuk ke hotel.”</div>
<div class="scene"><div class="visitor" id="visitor">${v.emoji}</div><div class="dialogue"><div class="name">TAMU #${String(state.index).padStart(2,'0')} • IDENTITAS BELUM DIVERIFIKASI</div><p id="speech">Selamat siang, aku ingin masuk ke hotel.</p><div class="tiny">Tamu menatapmu. Terlalu lama. Mungkin cuma lelah. Mungkin bukan.</div></div></div>
<div><div class="row"><button id="ask" ${v.decided?'disabled':''}>⌕ T • TANYA TAMU</button><button id="feed">🍗 KASIH MAKAN PAUL</button></div><div class="question-area ${state.questionCount?'':'hidden'}" id="questions">${qbuttons}</div><div class="log" id="log">${state.log||'Menunggu keputusan. Kesopanan tidak menjamin keselamatan.'}</div><div class="action-buttons"><button class="safe" id="allow" ${v.decided?'disabled':''}>E • IZINKAN MASUK</button><button class="danger" id="sac" ${v.decided?'disabled':''}>Q • SACRIFICED</button></div></div>
<div class="feedbar"><span class="tiny">PAUL STATUS: ${state.index%2===0?'🍗 MAKAN DULU, PAUL.':'🐔 PAUL SEDANG MENGAWASI.'}</span><span class="pill">${state.mode==='story'?'STORY PROTOCOL':'ENDLESS PROTOCOL'}</span></div></div>${state.settings.hints?'<div class="tiny">T = pertanyaan • E = izinkan • Q = SACRIFICED • P/ESC = pause. Klik “Kasih Makan Paul” untuk menaikkan moral ayam.</div>':''}</div>`);
$('#pause').onclick=pauseMenu;$('#ask').onclick=()=>{if(v.decided)return;$('#questions').classList.toggle('hidden');state.questionCount++;sfx('ask')};
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>askQuestion(+b.dataset.q));
$('#allow').onclick=()=>decide('allow');$('#sac').onclick=()=>decide('sac');$('#feed').onclick=feedPaul;
}
function askQuestion(i){const v=state.visitor;if(v.decided||v.asked[i])return;v.asked[i]=true;const answer=v.isNal?v.char.lines[i]:v.normal[i];$('#speech').textContent=answer||'...';$('#log').textContent=v.isNal?'⚠ Pola bahasa terdeteksi: NAL-ish. Percayai instingmu, bukan dekorasi lobi.':'✓ Jawaban terdengar masuk akal. Tapi manusia juga bisa aneh, jadi tetap periksa.';const btn=document.querySelector(`[data-q="${i}"]`);if(btn){btn.disabled=true;btn.style.opacity='.35'}sfx(v.isNal?'wrong':'ask');}
function feedPaul(){sfx('good');showToast('🐔 PAUL TELAH DIBERI MAKAN. HOTEL MENDAPAT +1 MORAL AYAM.');$('#log').textContent='Paul makan dengan bahagia. Dia menatapmu seolah kamu baru saja menyelamatkan ekonomi global.'}
function decide(action){const v=state.visitor;if(!v||v.decided)return;v.decided=true;const correct=(action==='sac'&&v.isNal)||(action==='allow'&&!v.isNal);state.stats.total++;if(correct){state.stats.correct++;state.streak++;state.stats.streak=state.streak;state.best=Math.max(state.best,state.streak);state.stats.best=state.best;sfx(action==='sac'?'reveal':'good')}else{state.streak=0;sfx('bad');if(state.settings.shake){$('#app').classList.remove('shake');void $('#app').offsetWidth;$('#app').classList.add('shake');setTimeout(()=>$('#app').classList.remove('shake'),300)}}
if(action==='allow'){if(v.isNal)state.stats.nalSaved++;else state.stats.normalSaved++}else{if(v.isNal)state.stats.nalSacrificed++;else state.stats.normalSacrificed++}
const outcome=action==='sac'?(v.isNal?`IDENTITAS TERBONGKAR: ${v.char.emoji} ${v.char.name}.`:'Itu manusia normal. HR ingin berbicara denganmu.'):(v.isNal?'NAL DIIZINKAN MASUK. LOBI MENDADAK MEMILIKI GEOMETRI BARU.':'Tamu normal masuk. Dia memberi rating 5 bintang karena pelayanan cepat.');
$('#speech').textContent=outcome;$('#log').textContent=(correct?'✓ KEPUTUSAN BENAR. ':'✗ SALAH KEPUTUSAN. ')+(action==='sac'?'SACRIFICED PROTOCOL EXECUTED. ':'')+(correct?'Realitas bertahan satu tamu lagi.':'Humanity is cooked.');$('#visitor').textContent=action==='sac'&&v.isNal?v.char.emoji:v.emoji;$('#visitor').classList.toggle('reveal',action==='sac'&&v.isNal);$('#questions').classList.add('hidden');$('#ask').disabled=true;$('#allow').disabled=true;$('#sac').disabled=true;
if(action==='sac'){sfx('reveal');showToast(v.isNal?'💥 NAL DETECTED • SACRIFICED':'💥 SACRIFICED... TUNGGU, ITU MANUSIA NORMAL');}
setTimeout(()=>{if(state.mode==='story'&&state.index>=25)finishStory();else if(state.mode==='endless'){renderGame();newVisitor()}else newVisitor()},state.settings.autoNext?1450:2600)}
function pauseMenu(){state.paused=true;stopMusic();modalBack.classList.remove('hidden');modal.innerHTML=`<h2>Ⅱ SHIFT DITAHAN</h2><p>Oke kita berhenti dulu, sebelum Humanity terlalu cooked. Tarik napas. Paul belum tentu sudah makan.</p><div class="menu-buttons"><button class="primary" id="continue">▶ CONTINUE</button><button id="settings">⚙ SETTINGS</button><button id="how">▣ HOW TO PLAY</button><button class="danger" id="endshift">■ END SHIFT</button></div>`;$('#continue').onclick=()=>{modalBack.classList.add('hidden');state.paused=false;startMusic();renderGame()};$('#settings').onclick=()=>{modalBack.classList.add('hidden');settingsScreen('pause')};$('#how').onclick=()=>{modalBack.classList.add('hidden');howScreen('game')};$('#endshift').onclick=()=>{modalBack.classList.add('hidden');finishShift()}}
function finishStory(){stopMusic();modalBack.classList.remove('hidden');modal.innerHTML=`<h2>☎ PANGGILAN DARI BOSS</h2><div class="callbox">“Oke tugasmu selesai, kamu bisa pulang. Istirahatlah, sebelum fisika resign dari pekerjaannya.”</div><p>Shift selesai. Realitas masih berdiri, meski terlihat ingin mengajukan cuti.</p><button class="primary" id="result">LIHAT HASIL →</button>`;$('#result').onclick=()=>{modalBack.classList.add('hidden');showResults()};sfx('win')}
function finishShift(){state.ended=true;stopMusic();modalBack.classList.add('hidden');showResults()}
function showResults(){const s=state.stats||{};const accuracy=s.total?Math.round(s.correct/s.total*100):0;setScreen(`<div class="panel"><div class="bigresult">SHIFT COMPLETE</div><div class="subtitle">REALITAS SELAMAT... UNTUK SEKARANG</div><div class="stats"><div class="stat"><b>${s.normalSaved||0}</b><span>Normal Human Saved</span></div><div class="stat"><b>${s.nalSacrificed||0}</b><span>NAL Human SACRIFICED</span></div><div class="stat"><b>${s.normalSacrificed||0}</b><span>Normal Human SACRIFICED</span></div><div class="stat"><b>${s.nalSaved||0}</b><span>NAL Human Saved</span></div><div class="stat"><b>${s.best||0}</b><span>Streak terbesar (gabungan)</span></div><div class="stat"><b>${accuracy}%</b><span>Akurasi keputusan (${s.correct||0}/${s.total||0})</span></div></div><p class="tiny">Catatan HR: Tidak ada hukum fisika yang berhasil menghubungi pengacara. Paul menerima makanan tak terbatas sebagai kompensasi.</p><div class="menu-buttons"><button class="primary" id="again">↻ MAIN LAGI</button><button id="home">⌂ MAIN MENU</button></div></div>`);$('#again').onclick=()=>modeChoice();$('#home').onclick=home;sfx('win')}
window.addEventListener('keydown',e=>{if($('#loading')&&!$('#loading').classList.contains('hidden'))return;if(!modalBack.classList.contains('hidden')){if(e.key==='Escape'){modalBack.classList.add('hidden');state.paused=false;startMusic();renderGame()}return}if(!state.visitor||state.visitor.decided)return;const k=e.key.toLowerCase();if(k==='p'||k==='escape'){e.preventDefault();pauseMenu()}else if(k==='t'){$('#questions')?.classList.toggle('hidden');state.questionCount++;sfx('ask')}else if(k==='e')decide('allow');else if(k==='q')decide('sac');else if(k==='1')askQuestion(0);else if(k==='2')askQuestion(1);else if(k==='3')askQuestion(2);else if(k==='4')askQuestion(3);else if(k==='5')askQuestion(4);else if(k==='6')askQuestion(5)});
$('#loading').addEventListener('animationend',()=>{});setTimeout(()=>{$('#loading').classList.add('hidden');home()},1250);
})();
</script>
</body>
</html>
